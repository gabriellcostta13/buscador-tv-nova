name: Buscador de TVs para Gaming

on:
  workflow_dispatch:

  schedule:
    # Brasília (UTC-3)
    #
    # 09:10 BRT = 12:10 UTC
    # 15:10 BRT = 18:10 UTC
    # 21:10 BRT = 00:10 UTC
    #
    # Total: 3 execuções por dia.
    - cron: "10 12 * * *"
    - cron: "10 18 * * *"
    - cron: "10 0 * * *"


permissions:
  contents: write


concurrency:
  group: buscador-tv
  cancel-in-progress: false


jobs:

  buscar:
    runs-on: ubuntu-latest

    timeout-minutes: 10


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Baixar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 1


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip


      # ======================================================
      # DEPENDÊNCIAS
      # ======================================================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      # ======================================================
      # TESTES
      # ======================================================

      - name: Rodar testes
        run: |
          python -m pytest -q


      # ======================================================
      # BUSCA
      # ======================================================

      - name: Buscar promoções e enviar alertas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKEN_TELEGRAM: ${{ secrets.TOKEN_TELEGRAM }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python buscar_promocoes.py


      # ======================================================
      # PERSISTÊNCIA
      # ======================================================

      - name: Persistir controle de duplicidade
        run: |

          if git diff --quiet -- state/sent_offers.json; then
            echo "Nenhuma alteração no estado."
            exit 0
          fi

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/sent_offers.json

          git commit \
            -m "chore: atualizar estado do buscador"

          git push
```
